<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b141e">
<title>Swish</title>
<link rel="shortcut icon" href="assets/swish.png">
<link rel="manifest" href="/manifest.json">

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #121212;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 60px;
    min-height: 100vh;
  }

  .form-box {
    background: #1e1e1e;
    padding: 30px 20px;
    width: 90%;
    max-width: 400px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    border-radius: 12px;
    overflow: hidden;
    background: #2c2c2c;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 14px 0;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.2s, color 0.2s;
    user-select: none;
  }

  .tab.active {
    background: #679433;
    color: #fff;
    font-weight: bold;
  }

  input {
    padding: 16px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
    background: #2c2c2c;
    color: #fff;
    outline: none;
  }

  input::placeholder {
    color: #aaa;
  }

  button {
    padding: 18px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    background: #679433;
    color: #fff;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  button:hover {
    opacity: 0.85;
  }
</style>
</head>
<body>

<div class="form-box">
  <div class="tabs">
    <div class="tab active" id="personTab" onclick="selectTab('person')">Person</div>
    <div class="tab" id="companyTab" onclick="selectTab('company')">Företag</div>
  </div>

  <input type="text" id="name" placeholder="Mottagare namn">
  <input type="text" id="org" placeholder="Organisation" style="display:none;">
  <input type="text" id="number" placeholder="Swish-nummer">
  <input type="number" id="amount" placeholder="Belopp (kr)">

  <button onclick="createSwish()">Skapa betalning</button>
</div>

<script>
  let isCompany = false;

  function selectTab(tab) {
    isCompany = tab === 'company';
    document.getElementById("org").style.display = isCompany ? "block" : "none";

    // Highlight active tab
    document.getElementById("personTab").classList.toggle("active", !isCompany);
    document.getElementById("companyTab").classList.toggle("active", isCompany);
  }


  function generateReference() {
    let ref = "";
    for (let i = 0; i < 16; i++) {
      ref += Math.floor(Math.random() * 10);
      if ((i + 1) % 4 === 0 && i !== 15) ref += " ";
    }
    return ref;
  }

  function formatSwedishDateTime() {
    const now = new Date();
    const months = ["jan.", "feb.", "mars", "apr.", "maj", "juni", "juli", "aug.", "sep.", "okt.", "nov.", "dec."];
    return `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}, kl ${now.getHours().toString().padStart(2,"0")}:${now.getMinutes().toString().padStart(2,"0")}`;
  }

  function createSwish() {
    const data = {
      name: document.getElementById("name").value,
      number: document.getElementById("number").value,
      amount: document.getElementById("amount").value,
      time: formatSwedishDateTime(),
      isCompany: isCompany
    };
    if (isCompany) {
      data.org = document.getElementById("org").value;
      data.reference = generateReference();
    }
    localStorage.setItem("swishData", JSON.stringify(data));
    window.location.href = "swish.html";
  }
</script>

</body>
</html>
