<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Swish</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b141e">
  <link rel="shortcut icon" href="assets/swish.png">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <div class="phone">
    <div class="top-section" id="topSection">
      <canvas id="particleCanvas"></canvas>
      <div class="checkmark-circle">
        <img src="assets/check.png" alt="">
      </div>
      <p class="success-text">Din betalning är skickad!</p>
    </div>

    <div class="bottom-section">
      <p class="date-time" id="dateTime"></p>

      <div class="recipient-block">
        <p class="recipient-name" id="recipientName"></p>
        <p class="recipient-org" id="recipientOrg"></p>
        <p class="recipient-number" id="recipientNumber"></p>
      </div>

      <p class="amount" id="amount"></p>

      <div class="divider"></div>

      <div class="reference-row">
        <span class="ref-label">Referens</span>
        <span class="ref-value" id="reference"></span>
      </div>

      <div class="divider"></div>

      <div class="footer">
        <div class="swish-logo">
          <img src="assets/swish-big.png" alt="Swish" class="swish-img" />
        </div>
        <button class="close-btn" onclick="window.location.href='index.html'">✕</button>
      </div>
    </div>
  </div>

<script>
// ------------------ CANVAS SETUP ------------------
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
const section = document.getElementById('topSection');

let W, H;
let deviceRatio = window.devicePixelRatio || 1;

function resize() {
  const rect = section.getBoundingClientRect();
  W = rect.width;
  H = rect.height;

  canvas.width = W * deviceRatio;
  canvas.height = H * deviceRatio;

  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(deviceRatio, deviceRatio);
}

resize();
window.addEventListener('resize', () => {
  resize();
  initAmbient();
});

// ------------------ SETTINGS ------------------
const settings = {
  ambientCount: 40,
  ambientSpeed: 0.2,          // max ambient velocity
  fireworkCount: 50,
  fireworkSpeedMin: 0.5,        // min initial speed
  fireworkSpeedMax: 2,        // max initial speed
  fireworkLife: 200,           // longer lifetime
  fireworkGravity: 0.01,      // gentle falling
  fireworkSizeMin: 1.5,
  fireworkSizeMax: 5
};

// ------------------ PARTICLE SYSTEM ------------------
let ambient = [];
let fireworks = [];

function randomAmbient() {
  return {
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 2.2 + 0.6,
    vx: (Math.random() - 0.5) * settings.ambientSpeed,
    vy: (Math.random() - 0.5) * settings.ambientSpeed,
    alpha: Math.random() * 0.45 + 0.1
  };
}

function initAmbient() {
  ambient = Array.from({ length: settings.ambientCount }, randomAmbient);
}

initAmbient();

function spawnFirework(x, y) {
  for (let i = 0; i < settings.fireworkCount; i++) {
    const angle = Math.random() * Math.PI * 2; // random direction
    const speed = Math.random() * (settings.fireworkSpeedMax - settings.fireworkSpeedMin) + settings.fireworkSpeedMin;

    fireworks.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: Math.random() * (settings.fireworkSizeMax - settings.fireworkSizeMin) + settings.fireworkSizeMin,
      life: settings.fireworkLife,
      maxLife: settings.fireworkLife,
      gravity: settings.fireworkGravity
    });
  }
}

// ------------------ AUDIO ------------------
let audioCtx;
let pingBuffer;

async function loadPing() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const response = await fetch('assets/ping.mp3');
  const arrayBuffer = await response.arrayBuffer();
  pingBuffer = await audioCtx.decodeAudioData(arrayBuffer);
}

loadPing();

function playPing(xPosition) {
  if (!pingBuffer) return;

  const source = audioCtx.createBufferSource();
  source.buffer = pingBuffer;

  const pitch = 1.5 - (xPosition / W) * 0.75;
  source.playbackRate.value = pitch;

  source.connect(audioCtx.destination);
  source.start();
}

// ------------------ CLICK TO FIREWORK ------------------
section.addEventListener('click', (e) => {
  const rect = section.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  spawnFirework(x, y);
  playPing(x);
});

// ------------------ ANIMATION LOOP ------------------
function tick() {
  ctx.clearRect(0, 0, W, H);

  // Ambient particles
  for (const p of ambient) {
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < -4) p.x = W + 4;
    if (p.x > W + 4) p.x = -4;
    if (p.y < -4) p.y = H + 4;
    if (p.y > H + 4) p.y = -4;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
    ctx.fill();
  }

  // Fireworks
  fireworks = fireworks.filter(p => p.life > 0);

  for (const p of fireworks) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.98; // gentle air resistance
    p.life--;

    const alpha = p.life / p.maxLife;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.globalAlpha = alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(tick);
}

tick();

// ------------------ DATE & TIME ------------------
function formatSwedishDateTime() {
  const now = new Date();

  const months = [
    "jan.", "feb.", "mars", "apr.", "maj", "juni",
    "juli", "aug.", "sep.", "okt.", "nov.", "dec."
  ];

  const day = now.getDate();
  const month = months[now.getMonth()];
  const year = now.getFullYear();
  const hours = now.getHours().toString().padStart(2, "0");
  const minutes = now.getMinutes().toString().padStart(2, "0");

  return `${day} ${month} ${year}, kl ${hours}:${minutes}`;
}

// ------------------ LOAD DATA FROM LOCALSTORAGE ------------------
document.addEventListener("DOMContentLoaded", () => {
  const storedData = JSON.parse(localStorage.getItem("swishData"));
  if (!storedData) return;

  document.getElementById("dateTime").textContent = storedData.time;
  document.getElementById("recipientName").textContent = storedData.name;
  document.getElementById("recipientNumber").textContent = storedData.number;
  document.getElementById("amount").textContent = storedData.amount + " kr";

  if (storedData.isCompany) {
    document.getElementById("recipientOrg").textContent = storedData.org;
    document.getElementById("reference").textContent = storedData.reference;
  } else {
    document.getElementById("recipientOrg").remove();
    document.querySelector(".reference-row").remove();
    const dividers = document.querySelectorAll(".divider");
    dividers.forEach(d => d.remove());
  }
});
</script>

</body>
</html>
